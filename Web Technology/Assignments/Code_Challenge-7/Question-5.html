<!DOCTYPE html>
<html>
<head>
    <title>Div Child Selector</title>

    <style>
         div > h1 {
            background-color: lightblue;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div>
        <h1>This h1 is inside a div</h1>
    </div>

    <div>
        <h1>Another h1 inside div</h1>
    </div>

    <h1>This h1 is NOT inside a div</h1>

</body>
</html>
