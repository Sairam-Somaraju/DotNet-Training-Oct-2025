<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="jquery.js"></script>
    <style>
            body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 30px;
        }

        .container {
            width: 300px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .txt {
            width: 30%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .txt:focus {
            border-color: #f34b21;
            outline: none;
            box-shadow: 0 0 5px rgba(243, 33, 58, 0.5);
        }

        #btn {
            width: 32%;
            padding: 10px;
            font-size: 16px;
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .back-link {
    text-decoration: none;
    color: blue;
    font-size: 16px;
    font-weight: bold;
}
.back-link:hover {
    text-decoration: underline;
}
.back-link {
    display: inline-block;
    margin-top: 15px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    color: white;
    background: linear-gradient(135deg, #4CAF50, #2E7D32);
    padding: 10px 18px;
    border-radius: 6px;
    transition: all 0.3s ease;
}

    </style>
</head>
<body>
    <input type="text" class="txt" placeholder="Textbox 1"><br>
    <input type="text" class="txt" placeholder="Textbox 1"><br>
    <input type="text" class="txt" placeholder="Textbox 1"><br>

    <input type="button" id="btn" value="Change Color">

    <script>
        $("#btn").click(function ()
        {
        $(".txt").css("color", "red");
        $(".txt").css("background-color", "green");  
        $(".txt").css("border-color", "red");  
       });
    </script>
    <br><br>
    <a class="back-link" href="JQuery-5.html">Move to 5 One-></a> <br>

</body>
</html>
