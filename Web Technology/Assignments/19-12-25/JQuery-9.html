<!DOCTYPE html>
<html>
<head>
    <title>Count Elements using jQuery</title>
    <script src="jquery.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            width: 400px;
            margin: 0 auto;
            background: #f0f0f0;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .result {
            margin: 10px 0;
            padding: 10px;
            background-color: #2196F3;
            color: white;
            border-radius: 5px;
            font-size: 16px;
        }

        #btnCount {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #btnCount:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Element Counter</h2>

    <div class="sample">
        <h1>Heading 1</h1>
        <p>Paragraph 1</p>
    </div>

    <div class="sample">
        <h1>Heading 2</h1>
        <p>Paragraph 2</p>
        <p>Paragraph 3</p>
    </div>

    <h1>Heading 3 outside div</h1>

    <div id="results">
        <div class="result" id="h1Count">No of H1: 0</div>
        <div class="result" id="divCount">No of Div: 0</div>
        <div class="result" id="pCount">No of Paragraphs: 0</div>
    </div>

    <input type="button" id="btnCount" value="Count Elements">
</div>

<script>

    $("#btnCount").click(function () {
        var h1Num = $("h1").length;
        var divNum = $("div").length;
        var pNum = $("p").length;

        $("#h1Count").text("No of H1: " + h1Num);
        $("#divCount").text("No of Div: " + divNum);
        $("#pCount").text("No of Paragraphs: " + pNum);
    });
 
</script>

</body>
</html>
