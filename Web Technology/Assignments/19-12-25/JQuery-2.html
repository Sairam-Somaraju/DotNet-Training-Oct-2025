<!DOCTYPE html>
<html>
<head>
    <title>Hide Div on Click</title>
     <script src="jquery.js"></script>
     <style>
        #myDiv {
            width: 300px;
            height: 100px;
            background-color: lightblue;
            border: 2px solid blue;
            text-align: center;
            line-height: 100px;
            font-size: 18px;
            cursor: pointer;
        }
        .back-link {
    text-decoration: none;
    color: blue;
    font-size: 16px;
    font-weight: bold;
}
.back-link:hover {
    text-decoration: underline;
}
.back-link {
    display: inline-block;
    margin-top: 15px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    color: white;
    background: linear-gradient(135deg, #4CAF50, #2E7D32);
    padding: 10px 18px;
    border-radius: 6px;
    transition: all 0.3s ease;
}

    </style>
</head>
<body>

<div id="myDiv">Click this div to hide</div>

<script>
    $("#myDiv").click(function ()
    {
        $(this).hide(2000) ;
    });
</script>
<br><br>
<a class="back-link" href="JQuery-3.html">Move to 3 One-></a> 

</body>
</html>
