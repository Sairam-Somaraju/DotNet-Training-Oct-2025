<!DOCTYPE html>
<html>
<head>
    <title>Append Paragraph on Input Change</title>
 
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        input#myInput {
            padding: 8px 12px;
            width: 250px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #container p {
             color: #00796b;
            padding: 8px 12px;
            border-radius: 5px;
            margin: 10px auto;
            max-width: 300px;
            text-align: left;
        }
    </style>
</head>
<body>

    <h2>Input Change Example</h2>
    <input type="text" id="myInput" placeholder="Type something">

    <div id="container"> </div>
     <script>
         $("#myInput").on("change", function () {
             $("#container").append("<p> changed the input to: " + $(this).val() + "</p>");
        });
    </script>

</body>
</html>
