<!DOCTYPE html>
<html>
<head>
    <title>Copy Div Content</title>

    <script src="jquery.js"></script>
    <style>
        .box {
            border: 2px solid #e64949;
            padding: 15px;
            width: 200px;
            height: 40px;
            margin-bottom: 15px;
            font-size: 18px;
            text-align: center;
            background-color: #8ebfea;
        }
        #btn {
            padding: 8px 15px;
            font-size: 16px;
            cursor: pointer;
        }
        .back-link {
    text-decoration: none;
    color: blue;
    font-size: 16px;
    font-weight: bold;
}
.back-link:hover {
    text-decoration: underline;
}
.back-link {
    display: inline-block;
    margin-top: 15px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    color: white;
    background: linear-gradient(135deg, #4CAF50, #2E7D32);
    padding: 10px 18px;
    border-radius: 6px;
    transition: all 0.3s ease;
}


    </style>
</head>
<body>

<div id="div1" class="box"> SAIRAM</div>

<div id="div2" class="box"></div>

<input type="button" id="btn" value="Copy Content">

<script>
    $("#btn").click(function () {
        var data = $("#div1").html();
        $("#div2").html(data);
    });
</script>
<br><br>
<a class="back-link" href="JQuery-2.html">Move to 2 One-></a> 

</body>
</html>
