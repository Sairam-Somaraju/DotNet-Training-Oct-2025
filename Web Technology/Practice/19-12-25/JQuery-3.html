<!DOCTYPE html>
<html>
<head>
    <title>Change Image using jQuery</title>
    <script src="jquery.js"></script>
 
    <style>
        #imageid {
            width: 250px;
            height: 200px;
            border: 3px solid #333;
            display: block;
            margin-bottom: 15px;
        }

        #btn {
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
        }

        #btn:hover {
            background-color: #45a049;
        }
        .back-link {
    text-decoration: none;
    color: blue;
    font-size: 16px;
    font-weight: bold;
}
.back-link:hover {
    text-decoration: underline;
}
.back-link {
    display: inline-block;
    margin-top: 15px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    color: white;
    background: linear-gradient(135deg, #4CAF50, #2E7D32);
    padding: 10px 18px;
    border-radius: 6px;
    transition: all 0.3s ease;
}

    </style>
</head>
<body>

<img id="imageid" src="https://gifdb.com/images/thumbnail/telugu-shanmukh-jaswanth-no-comment-rgtnbpqmir8vl9f8.gif" alt="Image">
<input type="button" id="btn" value="Change Image">

<script>

    $("#btn").click(function () {
       $("#imageid").attr("src", "https://gifdb.com/images/thumbnail/telugu-getup-srinu-jabardasth-4g2xklf44ezcv4j0.gif");
        
    });
</script>
<br>

<a class="back-link" href="JQuery-4.html">Move to 4 One-></a>
<br>

</body>
</html>
