<!DOCTYPE html>
<html>
<head>
    <title>Change Image Size</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            text-align: center;
            background-color: #f2f2f2;
        }

        #myImage {
            width: 200px;
            height: 150px;
            border: 2px solid #333;
            border-radius: 8px;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        #btnResize {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #btnResize:hover {
            background-color: #1976D2;
        }
    </style>
</head>

<body>

<img id="myImage" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTebdUdSvO7HkwyzyBk7tJZ0KEXBPjcDm4WIA&s" alt="Sample Image">

<br>

<input type="button" id="btnResize" value="Resize Image">

<script>
 
    $("#btnResize").click(function () {
        $("#myImage").attr({
            "width": "350",
            "height": "250"
        });
    });
</script>

</body>
</html>
