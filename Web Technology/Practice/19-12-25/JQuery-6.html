<!DOCTYPE html>
<html>
<head>
    <title>Textbox Focus Effect</title>
    <script src="jquery.js"></script>

    <style>
        .txt {
            width: 220px;
            padding: 8px;
            margin: 8px 0;
            font-size: 16px;
            border: 2px solid gray;
        }
        .back-link {
    text-decoration: none;
    color: blue;
    font-size: 16px;
    font-weight: bold;
}
.back-link:hover {
    text-decoration: underline;
}
.back-link {
    display: inline-block;
    margin-top: 15px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    color: white;
    background: linear-gradient(135deg, #4CAF50, #2E7D32);
    padding: 10px 18px;
    border-radius: 6px;
    transition: all 0.3s ease;
}
    </style>
</head>

<body>

<input type="text" class="txt" placeholder="Textbox 1"><br>
<input type="text" class="txt" placeholder="Textbox 2"><br>
<input type="text" class="txt" placeholder="Textbox 3"><br>

<script>
$(document).ready(function () {

    $(".txt").focus(function () {
        $(this).css({
            "background-color": "red",
            "border-color": "yellow"
        });
    });

    $(".txt").blur(function () {
        $(this).css({
            "background-color": "white",
            "border-color": "green"
        });
    });

});
</script>
<br><br>
<a class="back-link" href="JQuery-7.html">Move to 7 One-></a>  

</body>
</html>
