<!DOCTYPE html>
<html>
<head>
    <title>Mouseover and Mouseout Demo</title>
    <script src="jquery.js"></script>
    <style>
        .box {
            width: 200px;
            height: 100px;
            background-color: lightcoral;
            text-align: center;
            line-height: 100px;
            font-size: 18px;
            color: white;
            margin: 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .back-link {
    text-decoration: none;
    color: blue;
    font-size: 16px;
    font-weight: bold;
}
.back-link:hover {
    text-decoration: underline;
}
.back-link {
    display: inline-block;
    margin-top: 15px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    color: white;
    background: linear-gradient(135deg, #4CAF50, #2E7D32);
    padding: 10px 18px;
    border-radius: 6px;
    transition: all 0.3s ease;
}
   
    </style>
</head>

<body>

<div class="box"> Over me!</div>

<script>

    $(".box").mouseover(function () {
        $(this).css({
            "background-color": "lightgreen",
            "color": "black",
            "font-weight": "bold"
        }).text("Mouse is over!");
    });

    $(".box").mouseout(function () {
        $(this).css({
            "background-color": "lightcoral",
            "color": "white",
            "font-weight": "normal"
        }).text("Hover over me!");
    });
</script>

</body>
</html>
