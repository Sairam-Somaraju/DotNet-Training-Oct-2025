<!DOCTYPE html>
<html>
<head>
    <title>Image Change using setInterval</title>
 
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            text-align: center;
            padding-top: 40px;
        }
 
        .image-box {
            width: 300px;
            height: 200px;
            margin: auto;
            border: 3px solid #333;
            border-radius: 6px;
            overflow: hidden;
        }
 
        img {
            width: 100%;
            height: 100%;
            transition: opacity 0.5s ease-in-out;
        }
    </style>
</head>
<body>
 
<h2>Image Slider (setInterval)</h2>
 
<div class="image-box">
    <img id="slider" src="https://t3.ftcdn.net/jpg/07/89/07/22/360_F_789072252_A67Kw8GHdmPWKKy6FOU1RK8oOrtAkEUr.jpg">
</div>
 
<script>
     var images = [
        "https://t4.ftcdn.net/jpg/07/04/64/87/360_F_704648706_pwvtBLBHDzAAivPOTc0agQDAX88HIeXN.jpg",
        "https://t4.ftcdn.net/jpg/16/08/34/69/360_F_1608346975_wLpcQpRMe3E25NQFJ4kAzEYKNHQcMclp.jpg",
        "https://t3.ftcdn.net/jpg/09/64/41/74/360_F_964417433_3pZNGr24NOf1EmM80QuYex4WHfOPw7Ft.jpg",
        "https://thumbs.dreamstime.com/b/dynamic-roosters-engaging-vigorous-combat-two-vibrant-face-off-intense-battle-showcasing-their-movements-colorful-343030660.jpg"
    ];
 
    var index = 0;
 
     setInterval(function () {
        index = (index + 1) % images.length;
        document.getElementById("slider").src = images[index];
    }, 2000);
</script>
 
</body>
</html>
