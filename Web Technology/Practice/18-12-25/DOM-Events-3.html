<!DOCTYPE html>
<html>
<head>
    <title>Employee Table Toggle Image</title>
    <link rel="stylesheet" href="Style1.css"/>

</head>
<body>

<h2 align="center">Employee Details</h2>

 <table>
    <tr>
        <th>Employee Photo</th>
        <th>Emp Name</th>
        <th>Display Image</th>
    </tr>

    <tr>
        <td>
            <img src="https://static.vecteezy.com/system/resources/thumbnails/038/962/461/small/ai-generated-caucasian-successful-confident-young-businesswoman-ceo-boss-bank-employee-worker-manager-with-arms-crossed-in-formal-wear-isolated-in-white-background-photo.jpg" id="img1">
        </td>
        <td>Leonardo</td>
        <td>
            <button onclick="toggleImage('img1')">Hide / Show</button>
        </td>
    </tr>

    <tr>
        <td>
            <img src="https://as1.ftcdn.net/jpg/05/07/07/82/1000_F_507078262_VBnWiClJVEQJd9QmQntO6nICgDYrbGTU.jpg" id="img2">
        </td>
        <td>Cersi</td>
        <td>
            <button onclick="toggleImage('img2')">Hide / Show</button>
        </td>
    </tr>
</table>

<script>
    function toggleImage(imageId) {
        var image = document.getElementById(imageId);
        image.classList.toggle("hide");
    }
</script>

</body>
</html>
