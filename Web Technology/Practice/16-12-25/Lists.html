<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lists</title>

<style>
/* Reset */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

/* Body */
body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #edf6ff, #f9fbff);
    color: #2c3e50;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Container */
.container {
    width: 90%;
    max-width: 900px;
    background: #ffffff;
    padding: 40px;
    border-radius: 20px;
    border: 4px solid #3a86ff;
    box-shadow: 0 15px 30px rgba(58,134,255,0.25);
}

/* Headings */
h1 {
    text-align: center;
    color: #1d3557;
    font-size: 2.5em;
    margin-bottom: 30px;
}

.section {
    margin-bottom: 30px;
}

/* Section Title */
.section h2 {
    font-size: 1.6em;
    color: #3a86ff;
    margin-bottom: 15px;
    border-left: 6px solid #3a86ff;
    padding-left: 12px;
}

/* List Card */
.list-card {
    background-color: #f4f8ff;
    border-radius: 15px;
    padding: 20px 30px;
    border: 2px solid #dbe7ff;
    transition: transform 0.3s, box-shadow 0.3s;
}

.list-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(58,134,255,0.2);
}

/* Ordered List */
ol {
    padding-left: 25px;
}

li {
    font-size: 1.1em;
    padding: 8px 0;
}

/* Special formatting */
.code {
    font-family: Consolas, monospace;
    background: #ffffff;
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid #cfdcff;
}

/* Back link */
.back-link {
    display: block;
    text-align: center;
    margin-top: 30px;
    text-decoration: none;
    font-weight: bold;
    color: #3a86ff;
    padding: 12px;
    border-radius: 30px;
    border: 2px solid #3a86ff;
    transition: 0.3s;
}

.back-link:hover {
    background-color: #3a86ff;
    color: white;
}

/* Responsive */
@media (max-width: 600px) {
    h1 {
        font-size: 2em;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>HTML Lists & Terms</h1>

    <!-- Entities -->
    <div class="section">
        <h2>Terms – Entities</h2>
        <div class="list-card">
            <ol>
                <li><span class="code">&trade;</span> (TM)</li>
                <li><span class="code">&copy;</span> (Copyright)</li>
                <li><span class="code">&reg;</span> (Registered)</li>
            </ol>
        </div>
    </div>

    <!-- Currency -->
    <div class="section">
        <h2>Currency Symbols</h2>
        <div class="list-card">
            <ol>
                <li><span class="code">&yen;</span> – Japanese Yen</li>
                <li><span class="code">&#8377;</span> – Indian Rupee</li>
                <li><span class="code">&pound;</span> – British Pound</li>
            </ol>
        </div>
    </div>

    <!-- Scripts -->
    <div class="section">
        <h2>Scripts</h2>
        <div class="list-card">
            <ol>
                <li>H<sub>2</sub>O</li>
                <li>2<sup>3</sup> (Two power three)</li>
            </ol>
        </div>
    </div>

    <a href="About.html" class="back-link">← Back to About</a>

</div>

</body>
</html>
