<!DOCTYPE html>
<html>
<head>
    <title>Button Click Message</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin-top: 100px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            color:goldenrod;
        }

        #message {
            margin-top: 15px;
            color: green;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <button id="myButton">Click Me</button>
    <div id="message"></div>

    <script>
        let button = document.getElementById("myButton");
        let message = document.getElementById("message");

        button.addEventListener("click", function () 
        {
            message.innerHTML = "Button clicked successfully!";
        });
    </script>

</body>
</html>
